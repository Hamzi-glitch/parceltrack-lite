<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seller registration')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="h3 mb-3">Seller registration</h1>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{/register}" th:object="${registration}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="fullName" class="form-label">Full name</label>
                    <input id="fullName" th:field="*{fullName}" class="form-control" maxlength="100" required>
                    <div th:errors="*{fullName}" class="text-danger small"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" th:field="*{email}" type="email" class="form-control" required>
                    <div th:errors="*{email}" class="text-danger small"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" th:field="*{password}" type="password" class="form-control"
                           minlength="10" autocomplete="new-password" required>
                    <div th:errors="*{password}" class="text-danger small"></div>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm password</label>
                    <input id="confirmPassword" th:field="*{confirmPassword}" type="password"
                           class="form-control" minlength="10" autocomplete="new-password" required>
                    <div th:errors="*{confirmPassword}" class="text-danger small"></div>
                </div>
                <button type="submit" class="btn btn-primary">Create seller account</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
