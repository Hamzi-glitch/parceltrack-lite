<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1 class="h3 mb-3">Change password</h1>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{/change-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Current password</label>
                    <input id="currentPassword" name="currentPassword" type="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New password</label>
                    <input id="newPassword" name="newPassword" type="password" class="form-control"
                           minlength="10" autocomplete="new-password" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm new password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" class="form-control"
                           minlength="10" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Change password</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
