<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <h1 class="h3 mb-3">Admin dashboard</h1>
    <div th:if="${param.created}" class="alert alert-success">Rider account created.</div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- M3: parcel counts by delivery status, counted from the database. -->
    <section th:if="${statusCounts != null}" class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h5 mb-0">Parcels by status
                <span class="text-muted small" th:text="'(' + ${totalParcels} + ' total)'">(0 total)</span>
            </h2>
            <a th:href="@{/admin/parcels}" class="btn btn-primary btn-sm">Assign parcels to Riders</a>
        </div>
        <div class="row g-3">
            <div class="col-6 col-md" th:each="entry : ${statusCounts}">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <div class="display-6" th:text="${entry.value}">0</div>
                        <div class="text-muted small" th:text="${entry.key.label}">Status</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5">Create Rider account</h2>
            <form th:action="@{/admin/riders}" th:object="${rider}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="fullName" class="form-label">Full name</label>
                        <input id="fullName" th:field="*{fullName}" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" th:field="*{email}" type="email" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label for="riderPassword" class="form-label">Temporary password</label>
                        <input id="riderPassword" th:field="*{password}" type="password" class="form-control"
                               minlength="10" autocomplete="new-password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Create Rider</button>
            </form>
        </div>
    </div>

    <h2 class="h5">Rider accounts</h2>
    <table class="table">
        <thead><tr><th>Name</th><th>Email</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="rider : ${riders}">
            <td th:text="${rider.fullName}"></td>
            <td th:text="${rider.email}"></td>
            <td th:text="${rider.enabled ? 'Enabled' : 'Disabled'}"></td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/change-password}" class="btn btn-outline-primary">Change password</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
