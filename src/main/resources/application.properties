spring.application.name=ParcelTrack

# --- Database (MySQL) ---
# Credentials come from environment variables or application-local.properties (git-ignored).
# Never put a real password in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parceltrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:parceltrack}
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:file:./application-local.properties

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Sessions ---
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Set to true when served over HTTPS.
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie

# --- Safe error pages: never show stack traces or exception messages to users ---
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# --- File uploads (M3: proof of delivery) ---
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Stored outside src/main/resources/static so uploads can never be served or executed directly.
app.upload-dir=${UPLOAD_DIR:./uploads}
